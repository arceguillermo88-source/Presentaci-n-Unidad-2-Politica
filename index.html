<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Política Educativa Argentina · Unidad 2</title><style>
:root{--green:#123f30;--cream:#f9f2e4;--orange:#d97720;--muted:#6a746c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--green);font:16px system-ui,sans-serif}button,select,a{font:inherit}button,select{cursor:pointer;border:1px solid #c9c9b9;border-radius:10px;padding:10px 14px;background:#fffaf0;color:var(--green)}button:hover{background:#f1dfc5}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#246147}header{background:var(--green);color:#fff8e9;padding:24px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:5px solid var(--orange)}header small{letter-spacing:2px;color:#f1c597}h1{font: bold clamp(22px,4vw,36px) Georgia,serif;margin:6px 0 0}main{max-width:1400px;margin:auto;padding:20px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:20px}aside{background:#fffaf1;border:1px solid #e3d7c3;border-radius:16px;padding:12px;align-self:start}aside h2{font-size:13px;letter-spacing:1.5px;margin:8px 10px 14px}#index{display:grid;gap:8px}.chapter{display:flex;align-items:center;gap:10px;text-align:left;width:100%;font-size:13px;padding:8px;border:1px solid transparent;background:transparent}.chapter img{width:65px;aspect-ratio:16/9;object-fit:contain;border-radius:4px}.chapter.active{background:#e3ebdf;border-color:#8da28e}.chapter span{flex:1}.chapter b{font-size:11px;color:#956029;display:block}.panel{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}h2{margin:4px 0;font: bold 23px Georgia,serif}.stage{background:#18382c;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9;box-shadow:0 8px 24px #193b3020;display:grid;place-items:center}.stage img{display:block;width:100%;height:100%;object-fit:contain}.stage img.enter{animation:slide .55s cubic-bezier(.2,.75,.25,1) both}.stage img.back{animation:back .55s cubic-bezier(.2,.75,.25,1) both}@keyframes slide{from{opacity:.15;transform:translateX(35px) scale(.975)}to{opacity:1;transform:none}}@keyframes back{from{opacity:.15;transform:translateX(-35px) scale(.975)}to{opacity:1;transform:none}}.bar{height:6px;background:#ded8c8;border-radius:9px;overflow:hidden;margin:16px 0 10px}.bar div{height:100%;background:var(--orange);transition:width .5s}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.tools{display:flex;gap:6px;flex-wrap:wrap}.note{background:#fffaf0;border:1px solid #e6d8bd;border-radius:12px;padding:16px;margin-top:16px}.note summary{font-weight:bold;cursor:pointer}.note p{line-height:1.65;margin-bottom:0}.dots{display:flex;justify-content:center;gap:7px;margin:14px 0}.dots button{width:12px;height:12px;padding:0;border-radius:50%;background:#c7cbbd;border:none}.dots button.active{background:var(--orange);transform:scale(1.25)}footer{font-size:12px;color:var(--muted);text-align:center;padding:8px 20px 20px}dialog{width:min(98vw,1400px);max-height:96vh;background:#142e24;color:white;border:0;padding:12px;border-radius:12px}dialog::backdrop{background:#000b}dialog img{display:block;width:100%;height:auto}dialog .zoom-scroll{overflow:auto;max-height:80vh}dialog .zoom-scroll img{width:150%;max-width:none}dialog button{margin-bottom:10px}#fullscreen:fullscreen{background:#142e24;color:white;padding:16px;display:flex;flex-direction:column;justify-content:center}#fullscreen:fullscreen .stage{max-height:78vh;aspect-ratio:auto;flex:1}#fullscreen:fullscreen .stage img{max-height:78vh}#fullscreen:fullscreen .note{display:none}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}aside{order:2}#index{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter img{width:48px}header{padding:18px}h2{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><header><div><small>TRAMO PEDAGÓGICO · UNIDAD 2</small><h1>Política Educativa Argentina</h1><div>Normativa y marcos legales contemporáneos</div></div><button id="restart">↺ Volver al inicio</button></header><main><aside><h2>RECORRIDO DE LA UNIDAD</h2><nav id="index" aria-label="Índice de diapositivas"></nav></aside><section class="panel" id="fullscreen"><div class="top"><div><div class="eyebrow" id="count" aria-live="polite"></div><h2 id="title"></h2></div><div class="tools"><button id="zoom">＋ Ampliar</button><button id="full">⛶ Pantalla completa</button></div></div><div class="stage" id="stage"><img id="slide" alt=""></div><div class="bar" role="progressbar" aria-label="Posición en el recorrido" aria-valuemin="0" aria-valuemax="100"><div id="progress"></div></div><div class="controls"><button id="prev">← Anterior</button><span id="position"></span><button id="next" class="primary">Siguiente →</button></div><div class="dots" id="dots" aria-label="Navegación rápida"></div><details class="note" id="note"><summary>💡 Clave de lectura y reflexión</summary><p id="key"></p><p id="question"></p></details></section></main><footer>Material de estudio · Navegá con las flechas del teclado o deslizá la diapositiva en el celular.</footer><dialog id="modal"><button id="close">✕ Cerrar ampliación</button><div class="zoom-scroll"><img id="large" alt="Diapositiva ampliada"></div></dialog><script>
const data=[['Normativa y marcos legales contemporáneos','Inicio del recorrido por las transformaciones normativas de la educación argentina.','¿Qué relación existe entre las políticas educativas y el contexto histórico?'],['Congreso Pedagógico Nacional (1984–1988)','El material destaca la participación social, los acuerdos sobre escolaridad y la propuesta de un currículum flexible.','¿Qué aporta la participación de distintos actores a la construcción de políticas educativas?'],['La puesta en marcha de las políticas neoliberales','La diapositiva distingue la descentralización administrativa de la centralización de los contenidos comunes y presenta la EGB y el Polimodal.','¿Qué tensiones pueden surgir entre descentralizar la gestión y coordinar los contenidos?'],['Ley de Educación Superior','La Ley 24.521 regula instituciones universitarias y no universitarias. El material presenta además una lectura crítica del proceso de reforma.','¿Qué cambios supone incluir la formación docente en el nivel superior?'],['La Ley Federal: el fin de la agonía','La presentación analiza críticamente las consecuencias de la Ley Federal y la transición política hacia 2003.','¿Qué problemas del sistema educativo identifica el material?'],['La recuperación de la Escuela Técnica','La Ley 26.058 reconoce la educación técnico profesional como un derecho y vincula la formación con el trabajo y la producción.','¿Cómo se articulan la formación general y la profesional?'],['El camino hacia la Ley Nacional de Educación','La diapositiva presenta los niveles, las ocho modalidades y los artículos sobre articulación, gestión privada y educación a distancia.','¿Cómo contribuyen las modalidades a atender distintas necesidades educativas?'],['Bibliografía de referencia','Consultá las fuentes académicas y normativas que sustentan el recorrido.','¿Qué texto elegirías para profundizar el tema que más te interesó?']];
const $=x=>document.getElementById(x);let i=0;const url=n=>`slide-${n+1}.jpg`;const index=$('index'),dots=$('dots');data.forEach((d,n)=>{let b=document.createElement('button');b.className='chapter';let im=document.createElement('img');im.src=url(n);im.alt='';let s=document.createElement('span'),num=document.createElement('b');num.textContent=String(n+1).padStart(2,'0');s.append(num,document.createTextNode(d[0]));b.append(im,s);b.onclick=()=>go(n);index.append(b);let dot=document.createElement('button');dot.setAttribute('aria-label',`Ir a diapositiva ${n+1}`);dot.onclick=()=>go(n);dots.append(dot)});function go(n,first=false){if(n<0||n>=data.length)return;let dir=n<i?'back':'enter';i=n;$('title').textContent=data[i][0];$('count').textContent=`DIAPOSITIVA ${i+1} DE ${data.length}`;$('slide').src=url(i);$('slide').alt=data[i][0];$('slide').className='';void $('slide').offsetWidth;if(!first)$('slide').className=dir;$('key').textContent=data[i][1];$('question').textContent=data[i][2];$('note').open=false;$('position').textContent=`${i+1} / ${data.length}`;let pct=Math.round((i+1)/data.length*100);$('progress').style.width=pct+'%';document.querySelector('.bar').setAttribute('aria-valuenow',pct);$('prev').disabled=i===0;$('next').disabled=i===data.length-1;[index,dots].forEach(el=>[...el.children].forEach((b,n)=>{b.classList.toggle('active',n===i);if(n===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')}));} $('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('restart').onclick=()=>go(0);$('zoom').onclick=()=>{$('large').src=url(i);$('modal').showModal()};$('close').onclick=()=>$('modal').close();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('fullscreen').requestFullscreen()}catch(e){$('large').src=url(i);$('modal').showModal()}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'⛶ Salir de pantalla completa':'⛶ Pantalla completa'});document.addEventListener('keydown',e=>{if($('modal').open||['BUTTON','INPUT','SELECT','TEXTAREA','SUMMARY'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(i+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}if(e.key==='Home')go(0);if(e.key==='End')go(data.length-1)});let x=0,y=0;$('stage').addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1))},{passive:true});go(0,true);
</script></body></html>
